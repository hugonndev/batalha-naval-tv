name: Compilar app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar o .apk
        run: gradle assembleDebug --no-daemon

      - name: Renomear
        run: cp app/build/outputs/apk/debug/app-debug.apk batalha-naval.apk

      - name: Publicar na Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Batalha Naval (versão ${{ github.run_number }})
          make_latest: true
          files: batalha-naval.apk
